name: preview teardown

run-name: ${{ github.event_name == 'pull_request' && format('teardown of #{0}', github.event.pull_request.number) || 'preview sweep' }}

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'preview-sweep' }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  teardown:
    if: >-
      vars.PREVIEWS == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: preview
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.PREVIEW_NEON_PROJECT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: preview-teardown
      - if: github.event_name == 'pull_request'
        run: pnpm --filter @parfocal/deploy run preview teardown --pr "${PR_NUMBER}"
      - if: github.event_name != 'pull_request'
        run: pnpm --filter @parfocal/deploy run preview sweep
