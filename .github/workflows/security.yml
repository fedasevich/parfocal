name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  dependency-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/install-osv-scanner
      - uses: ./.github/actions/install-trivy
      - run: node scripts/osv-scan.ts self-test
      - run: node scripts/osv-scan.ts iac-self-test
      - run: node scripts/osv-scan.ts scan
      - run: node scripts/osv-scan.ts iac
      - if: always()
        name: Write the vulnerability report
        run: node scripts/osv-scan.ts report "$RUNNER_TEMP/vulnerability-report.md"
      - if: always()
        name: Publish the report to the job summary
        run: cat "$RUNNER_TEMP/vulnerability-report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report
          path: ${{ runner.temp }}/vulnerability-report.md
          retention-days: 90
          if-no-files-found: ignore

  dast-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: dast
      - run: pnpm --filter @parfocal/web build
        env:
          PARFOCAL_PUBLIC_APP_ENV: dev
          PARFOCAL_PUBLIC_FAKE_API: all
      - name: Serve the built app
        working-directory: apps/web
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Run the ZAP baseline scan
        run: |
          mkdir -p /tmp/zap
          cp .zap/rules.tsv /tmp/zap/rules.tsv
          chmod -R a+rwx /tmp/zap
          docker run --rm --network host -v /tmp/zap:/zap/wrk:rw "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:4173 -m 1 -c rules.tsv -r report.html -J report.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline
          path: |
            /tmp/zap/report.html
            /tmp/zap/report.json
          retention-days: 14
          if-no-files-found: ignore
