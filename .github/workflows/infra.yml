name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  tofu-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tofu
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.x
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
