name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read

jobs:
  tofu-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tofu
    env:
      CONFTEST_VERSION: 0.71.1
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.x
      - run: tofu fmt -check -recursive
      - name: Validate every root
        run: |
          for root in global dev staging prod; do
            tofu -chdir="${root}" init -backend=false -input=false
            tofu -chdir="${root}" validate
          done
      - name: Install conftest
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" conftest
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: conftest fmt --check policy
      - run: ./policy.sh static
