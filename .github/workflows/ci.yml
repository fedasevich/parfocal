name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Regenerate the golden images on the runner and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FROM="$BASE"
          if [ -z "$FROM" ]; then
            FROM=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -z "$FROM" ] || ! git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            echo "No base to compare with, running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $FROM..$TO"
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/design/*) code=true ;;
              docs/*|*.md) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$FROM" "$TO")
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: lint
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 1.9.0
          BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
        run: |
          curl -fsSLo /tmp/betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  /tmp/betterleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/betterleaks.tar.gz -C /usr/local/bin betterleaks
      - run: pnpm secrets
      - run: pnpm check
      - name: Check commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then FROM="$TO~1"; fi
          pnpm commitlint --from "$FROM" --to "$TO" --verbose

  typecheck:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: typecheck
      - run: pnpm turbo run typecheck --cache-dir=.turbo/cache
      - run: pnpm exec tsc --noEmit -p scripts
      - run: pnpm test:guards

  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: test
      - uses: actions/cache@v6
        with:
          path: ~/.cache/parfocal/fixtures
          key: fixtures-${{ hashFiles('packages/test-fixtures/fixtures.json') }}
      - run: pnpm fixtures
      - run: pnpm turbo run test --cache-dir=.turbo/cache
      - name: Check the generated API client is current
        run: |
          pnpm api:generate
          git status --porcelain -- packages/api-client
          test -z "$(git status --porcelain -- packages/api-client)"

  db:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: db
      - uses: actions/cache@v6
        with:
          path: ~/.cache/parfocal/fixtures
          key: fixtures-small-${{ hashFiles('packages/test-fixtures/fixtures.json') }}
      - run: pnpm fixtures small
      - run: docker compose up -d --wait
      - run: uv run pytest -m db --durations=25
        env:
          PARFOCAL_REQUIRE_FIXTURES: small
      - if: failure()
        run: docker compose logs

  formats:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: formats
      - uses: actions/cache@v6
        with:
          path: ~/.cache/parfocal/fixtures
          key: fixtures-formats-${{ hashFiles('packages/test-fixtures/fixtures.json') }}
      - run: pnpm fixtures small formats
      - run: uv run pytest workers/ingest/tests
        env:
          PARFOCAL_REQUIRE_FIXTURES: small,formats

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: e2e
      - uses: actions/cache@v6
        with:
          path: ~/.cache/parfocal/fixtures
          key: fixtures-small-${{ hashFiles('packages/test-fixtures/fixtures.json') }}
      - run: pnpm fixtures small
      - run: docker compose up -d --wait
      - run: pnpm db:migrate
      - name: Write the local settings
        env:
          ZITADEL_CLIENT_ID: ${{ secrets.ZITADEL_DEV_CLIENT_ID }}
          ZITADEL_CLIENT_SECRET: ${{ secrets.ZITADEL_DEV_CLIENT_SECRET }}
          ZITADEL_TEST_USERNAME: ${{ secrets.ZITADEL_TEST_USERNAME }}
          ZITADEL_TEST_PASSWORD: ${{ secrets.ZITADEL_TEST_PASSWORD }}
        run: |
          umask 077
          {
            echo "APP_ENV=test"
            echo "PARFOCAL_PUBLIC_APP_ENV=test"
            echo "DATABASE_URL=postgresql://parfocal_app@localhost:6432/parfocal"
            echo "PUBLIC_ORIGIN=http://localhost:5173"
            echo "SESSION_KEY=$(python3 -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
            echo "MASTER_KEYS=ci:$(python3 -c 'import base64, secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())')"
            echo "ZITADEL_ISSUER=https://parfocal-iqcyh5.eu1.zitadel.cloud"
            echo "ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID}"
            echo "ZITADEL_CLIENT_SECRET=${ZITADEL_CLIENT_SECRET}"
            echo "ZITADEL_TEST_USERNAME=${ZITADEL_TEST_USERNAME}"
            echo "ZITADEL_TEST_PASSWORD=${ZITADEL_TEST_PASSWORD}"
          } > .env
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true' || (github.event_name == 'workflow_dispatch' && inputs.update_goldens)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ui, viewer-engine, golden-images, web, latency-proxy]
    name: browser (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: browser-${{ matrix.package }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/parfocal/fixtures
          key: fixtures-browser-${{ hashFiles('packages/test-fixtures/fixtures.json') }}
      - run: pnpm fixtures small viewer
      - run: google-chrome --version
      - if: ${{ github.event_name != 'workflow_dispatch' }}
        run: pnpm turbo run test:browser --filter=@parfocal/${{ matrix.package }}
        env:
          PARFOCAL_REQUIRE_FIXTURES: small,viewer
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens && matrix.package == 'golden-images' }}
        run: pnpm turbo run test:browser --filter=@parfocal/golden-images
        env:
          PARFOCAL_REQUIRE_FIXTURES: small,viewer
          GOLDEN_UPDATE: "1"
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_goldens && matrix.package == 'golden-images' }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: packages/golden-images/goldens/*.png

  ci-ok:
    if: always()
    needs: [changes, lint, typecheck, test, db, formats, e2e, browser]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}" = "true"
