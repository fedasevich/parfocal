<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="../../packages/tokens/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../packages/tokens/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Parfocal</title>
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--page, #121212);
        color: var(--accent-fill, #2563eb);
      }
      .boot-loader svg {
        width: 64px;
        height: 64px;
      }
      .boot-loader-corners {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-loader-breathe 1.6s ease-in-out infinite;
      }
      .boot-loader-name {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes boot-loader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.72); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-corners { animation: none; }
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) .boot-loader { background: #ececec; color: #1d5fd1; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" data-testid="boot-loader" role="status" aria-label="Loading Parfocal"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path class="boot-loader-corners" d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><span class="boot-loader-name">Parfocal</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
