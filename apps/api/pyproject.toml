[project]
name = "parfocal-api"
version = "0.0.0"
description = "FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<1.21",
    "cryptography>=50,<51",
    "fastapi>=0.142,<0.143",
    "httpx2>=2.13,<3",
    "parfocal-common",
    "pyjwt[crypto]>=2.15,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
parfocal-common = { workspace = true }

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = ["tests"]
