[project]
name = "parfocal-api"
version = "0.0.0"
description = "FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142,<0.143",
    "parfocal-common",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
parfocal-common = { workspace = true }

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
