[project]
name = "parfocal-common"
version = "0.0.0"
description = "Shared settings, logging, tenancy context and audit helpers for the Python services"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.32,<0.33",
    "geoalchemy2>=0.20,<0.21",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1.4,<2.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
