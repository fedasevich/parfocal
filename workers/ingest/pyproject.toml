[project]
name = "parfocal-ingest"
version = "0.0.0"
description = "Slide validation, indexing and thumbnails"
requires-python = ">=3.14,<3.15"
dependencies = [
    "msgspec>=0.21,<0.22",
    "opencv-python-headless>=5,<6",
    "openslide-bin>=4.0.1,<5",
    "openslide-python>=1.4.6,<2",
    "parfocal-common",
    "pillow>=13,<14",
    "scipy>=1.16,<2",
    "shapely>=2.1,<3",
    "tifffile>=2026.10.15,<2027",
    "wsidicom>=0.36,<0.37",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
parfocal-common = { workspace = true }

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
