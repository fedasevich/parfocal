[project]
name = "parfocal-ml"
version = "0.0.0"
description = "GPU inference and training jobs"
requires-python = ">=3.14,<3.15"
dependencies = [
    "modal>=1.6.3",
    "numpy>=2.5.4",
    "parfocal-common",
    "pillow>=13.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
export = [
    "onnx>=1.23.2,<1.24",
    "onnx-ir",
    "onnxruntime==1.31.1",
    "segment-anything==1.0",
    "torch>=2.15,<2.16",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
parfocal-common = { workspace = true }

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
exclude = ["spike", "src/parfocal_ml/sam_onnx", "tests/test_sam_onnx.py"]
