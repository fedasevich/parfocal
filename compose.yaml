name: parfocal

services:
  postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.22
    environment:
      POSTGRES_USER: parfocal
      POSTGRES_DB: parfocal
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    volumes:
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U parfocal -d parfocal"]
      interval: 1s
      retries: 60

  pooler:
    image: edoburu/pgbouncer:v1.26.0-p0
    volumes:
      - ./infra/local/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports: ["6432:5432"]
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: parfocal
      MINIO_ROOT_PASSWORD: ${PARFOCAL_LOCAL_MINIO_PASSWORD:-parfocal-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports: ["9000:9000"]
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      retries: 60

volumes:
  postgres-data:
  storage-data:
