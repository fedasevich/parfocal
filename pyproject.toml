[tool.uv.workspace]
members = ["apps/api", "workers/*", "packages/py-common"]

[dependency-groups]
dev = [
    "basedpyright>=1.40,<2",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["infra/tofu/.terraform"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_*.py" = ["PT009"]

[tool.ruff.lint.isort]
known-first-party = ["parfocal_api", "parfocal_common", "parfocal_ingest", "parfocal_ml"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
pythonpath = ["scripts"]
testpaths = ["apps/api/tests", "workers/ingest/tests", "workers/ml/tests", "packages/py-common/tests", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["scripts"]
