[tool.uv.workspace]
members = ["apps/api", "workers/*", "packages/py-common"]

[dependency-groups]
dev = [
    "basedpyright>=1.40,<2",
    "httpx2>=2.13,<3",
    "pypdf>=6.21,<7",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
    "uvicorn>=0.54,<0.55",
]
load = [
    "locust>=2.47,<3",
    "websockets>=15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["infra/tofu/.terraform"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
"scripts/test_*.py" = ["PT009", "PT027"]

[tool.ruff.lint.isort]
known-first-party = ["parfocal_api", "parfocal_common", "parfocal_ingest", "parfocal_ml"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "-m", "not db and not weights"]
markers = [
    "db: needs the local Postgres and pooler from compose.yaml (pnpm test:db)",
    "weights: needs model checkpoints and the parfocal-ml export extra (pnpm --filter @parfocal/ml test:weights)",
]
pythonpath = ["scripts", "apps/api/tests", "workers/ingest/tests", "workers/ml/tests"]
testpaths = ["apps/api/tests", "workers/ingest/tests", "workers/ml/tests", "packages/py-common/tests", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["scripts"]
