[[chapter]]
title = "The study"
group = "research"
intro = "Study mode runs usability sessions for the thesis. A facilitator starts a session, gives a participant tasks one at a time, times them and downloads the results. Everything is kept in this browser only."

[[chapter.step]]
role = "researcher"
title = "Open study mode"
url = "/study"
click = "Open the link. Read the session list and press Run a session."
expect = "The study page with its tasks and past rounds."
why = "Measured sessions are the evidence that the app is fast and clear to use."
api = ["/api/me/home"]

[[chapter.step]]
role = "researcher"
title = "Run a session"
url = "/study"
click = "Press Start session, then Start task for the first task. Mark it done, or use Skip or Gave up."
expect = "Each task is timed from Start task to its end."
why = "The times are compared across rounds."
api = ["/api/me/slides"]

[[chapter.step]]
role = "researcher"
title = "Edit the tasks and start the next round"
url = "/study"
click = "Change the task list and press Save tasks, then Start next round."
expect = "The new round uses the saved tasks."
why = "Each round tests the app after the fixes from the last one."
api = ["/api/me/home"]

[[chapter.step]]
role = "researcher"
title = "Download and replay"
url = "/study"
click = "Press Download results. Press Replay on a past session, then Play and Pause."
expect = "A results file downloads. The replay shows what the participant did, step by step."
why = "The results go into the thesis, and the replay shows where people got stuck."
api = ["/api/me/home"]

[[chapter.step]]
role = "reviewer-a"
title = "A reviewer as participant"
url = "/study"
click = "Sign in as role-reviewer-a@parfocal.eu in the participant's browser and run one task."
expect = "The same page works for a reviewer, with their own slides."
why = "Participants in the study are reviewers, not researchers."
api = ["/api/me/slides"]
